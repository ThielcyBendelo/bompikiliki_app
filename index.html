<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Informations Générales & SEO de base -->
    <title>Centre Médical Bompikiliki | Consultations & Soins de Santé</title>
    <meta name="description" content="Bienvenue au Centre Médical Bompikiliki. Prenez rendez-vous en ligne avec nos médecins généralistes et spécialistes. Des soins médicaux professionnels et de qualité." />
    <meta name="keywords" content="centre medical bompikiliki, clinique, medecin, rendez-vous medical, prise de rdv, sante, hopital, consultations" />
    <meta name="author" content="Centre Médical Bompikiliki" />
    <meta name="robots" content="index, follow" />
    
    <!-- Favicon de l'application -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Balises Open Graph / Facebook (Pour le partage sur les réseaux sociaux) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bompikiliki.com" />
    <meta property="og:title" content="Centre Médical Bompikiliki | Prenez Rendez-vous en Ligne" />
    <meta property="og:description" content="Accédez à votre dossier médical, consultez les plannings de nos médecins et planifiez votre prochaine consultation au Centre Médical Bompikiliki." />
    <meta property="og:image" content="/og-image.jpg" />

    <!-- Balises Twitter Card -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://bompikiliki.com" />
    <meta property="twitter:title" content="Centre Médical Bompikiliki | Prenez Rendez-vous en Ligne" />
    <meta property="twitter:description" content="Accédez à votre dossier médical, consultez les plannings de nos médecins et planifiez votre prochaine consultation." />
    <meta property="twitter:image" content="/og-image.jpg" />

    <!-- Préchargement des polices pour de meilleures performances (Core Web Vitals) -->
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
  </head>
  <body>
    <!-- Conteneur principal de l'application React -->
    <div id="root"></div>
    
    <!-- Script principal de l'application Vite -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
